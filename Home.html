<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TASKLY</title>
    <link rel="icon" href="Images/Logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="CSS/Styles.css">
    <link rel="stylesheet" href="CSS/DarkModeStyles.css">
    <link rel="stylesheet" href="CSS/KeyFrames.css">
    <link rel="stylesheet" href="CSS/MediaQueries.css">
</head>

<body onload="heroSectionHeight()" onresize="heroSectionHeight();">

    <nav class="navbar navbar-expand-sm" id="navbar">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <img src="Images/Logo.png" alt="Logo Taskly">
                <h1>
                    <span>T</span>
                    <span>A</span>
                    <span>S</span>
                    <span>K</span>
                    <span>L</span>
                    <span>Y</span>
                </h1>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex justify-content-center align-items-center gap-3 my-2 my-md-0">
                    <div>
                        <input class="visually-hidden" type="checkbox" role="switch" id="Mode">
                        <label for="Mode" class="mode-icon"></label>
                    </div>
                    <div>
                        <button onclick="window.open('Login.html', '_self')" class="loginBtn"></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero-section text-center">
        <div class="container">
            <div class="home">
                <!-- <h1>Tasks</h1> -->
                <div class="tasks row g-3" id="tasks">
                    
                    <!-- JS Add Task Here -->

                </div>
                <button id="addTask" class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#addTaskModal">Add Task</button>
            </div>
        </div>
    </section>


    <!-- Modal -->
    <div class="modal fade" id="addTaskModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="addTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addTaskModalLabel">Add Task</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm" class="d-flex flex-column justify-content-center gap-3" novalidate>
                        <div class="input-group">
                            <span class="input-group-text">Task Name:</span>
                            <input type="text" class="form-control" name="taskname" id="taskname" required>
                        </div>
                        <div>
                            <label>Date</label>
                            <div class="input-group">
                                <span class="input-group-text">From:</span>
                                <input type="date" class="form-control" name="taskdatefrom" id="taskdatefrom" required>
                                <span class="input-group-text">To:</span>
                                <input type="date" class="form-control" name="taskdateto" id="taskdateto" required>
                            </div>
                        </div>
                        <div>
                            <label>Time</label>
                            <div class="input-group">
                                <span class="input-group-text">From:</span>
                                <input type="time" class="form-control" name="tasktimefrom" id="tasktimefrom" required>
                                <span class="input-group-text">To:</span>
                                <input type="time" class="form-control" name="tasktimeto" id="tasktimeto" required>
                            </div>
                        </div>
                        <div>
                            <textarea name="description" id="description" placeholder="Description" class="form-control" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="addTaskBtn" form="addTaskForm">Understood</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="Javascript/Scripts.js"></script>
    
</body>

</html>
