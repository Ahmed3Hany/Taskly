<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TASKLY</title>
    <link rel="icon" href="Images/Logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="CSS/Styles.css">
    <link rel="stylesheet" href="CSS/DarkModeStyles.css">
    <link rel="stylesheet" href="CSS/KeyFrames.css">
    <link rel="stylesheet" href="CSS/MediaQueries.css">
</head>

<body onload="heroSectionHeight(); dataFormsStartup(); toggleDataForms();" onresize="heroSectionHeight(); dataFormsStartup(); adjustDataFormsOnResize();">

    <nav class="navbar navbar-expand-sm" id="navbar">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <img src="Images/Logo.png" alt="Logo Taskly">
                <h1>
                    <span>T</span>
                    <span>A</span>
                    <span>S</span>
                    <span>K</span>
                    <span>L</span>
                    <span>Y</span>
                </h1>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex justify-content-center align-items-center gap-3 my-2 my-md-0">
                    <div>
                        <input class="visually-hidden" type="checkbox" role="switch" id="Mode">
                        <label for="Mode" class="mode-icon"></label>
                    </div>
                    <div>
                        <button onclick="window.open('Login.html', '_self')" class="loginBtn"></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container dataForms row" id="dataForms">
            <button class="showSignUp" id="showSignUp" onclick="showSignUpForm();">
                <span>Sign<br>IN</span>
                <span>Sign<br>UP</span>
            </button>
            <div class="login col-md-6" id="login">
                <h1>Sign In</h1>
                <div class="social-links">
                    <a href="#"><i class="bi bi-facebook"></i></a>
                    <a href="#"><i class="bi bi-google"></i></a>
                    <a href="#"><i class="bi bi-linkedin"></i></a>
                </div>
                <p>or use your account</p>
                <form action="Home.html" id="loginForm">
                    <div>
                        <input type="text" name="username" id="username" placeholder="Username" class="form-control" required>
                    </div>
                    <div>
                        <input type="password" minlength="8" name="password" id="password" placeholder="Password" class="form-control" required>
                    </div>
                    <div>
                        <div class="form-check form-switch d-flex align-items-center gap-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="RememberMe" required>
                            <label class="form-check-label" for="RememberMe">Remember me</label>
                        </div>
                        <a href="#" class="f-pass-btn">Forgot Password?</a>
                    </div>
                    <div>
                        <button class="submitBtn" type="submit" value="SignIN">Sign IN</button>
                    </div>
                </form>
            </div>

            <div class="register col-md-6" id="register">   
                <h1>Create Account</h1>
                <div class="social-links">
                    <a href="#"><i class="bi bi-facebook"></i></a>
                    <a href="#"><i class="bi bi-google"></i></a>
                    <a href="#"><i class="bi bi-linkedin"></i></a>
                </div>
                <p>or use you email for registration</p>
                <form action="Home.html" id="registerForm">
                    <div>
                        <div class="input-group">
                            <input type="text" name="fname" id="fname" placeholder="First Name" aria-label="First name" class="form-control" required>
                            <input type="text" name="lname" id="lname" placeholder="Last Name" aria-label="Last name" class="form-control" required>
                        </div>
                    </div>
                    <div>
                        <input type="email" name="email" id="email" placeholder="Email" class="form-control" required>
                    </div>
                    <div>
                        <input type="password" minlength="8" name="newpassword" id="newpassword" placeholder="Password" class="form-control" minlength="8" required>
                    </div>
                    <div>
                        <button class="submitBtn" type="submit" value="SignUP">Sign UP</button>
                    </div>
                </form>
            </div>

            <div class="overlay col-md-6" id="overlay"></div>
        </div>
    </section>

    <script src="Javascript/Scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
