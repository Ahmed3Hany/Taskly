<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TASKLY</title>
    <link rel="icon" href="Images/Logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="DarkModeStyles.css">
</head>

<body>

    <nav class="navbar navbar-expand-sm">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <img src="Images/Logo.png" alt="Logo Taskly">
                <span>TASKLY</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex justify-content-center align-items-center gap-3 my-2 my-md-0">
                    <div>
                        <input class="visually-hidden" type="checkbox" role="switch" id="Mode">
                        <label for="Mode" class="mode-icon"></label>
                    </div>
                    <div>
                        <button onclick="window.open('Login.html')"  class="loginBtn"></button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero-section d-flex flex-column justify-content-center align-items-center text-center">
            <div class="container">
                <div class="login">
                    <form action="" id="loginForm">

                    </form>
                </div>
                <div class="register">
                    <form action="" id="registerForm">

                    </form>
                </div>
            </div>
        </section>
    </main>



    <script src="Scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

</body>
</html>
